# After publishing this fork, use this configuration in the ESPHome dashboard.
# Keep the same node name, OTA password and API key as the installed firmware.
esphome:
  name: apc-br1500g
  friendly_name: APC BR1500G

esp32:
  board: seeed_xiao_esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/iamangus/esphome-UPS-HID-NUT
      ref: main
    components: [ups_hid]
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  # use_address: apc-br1500g.your-domain

logger:
  level: INFO
  baud_rate: 0

api:
  reboot_timeout: 0s
  # Preserve your existing API encryption key, if configured.

ota:
  - platform: esphome
    password: !secret ota_password

ups_hid:
  id: ups_monitor
  protocol: apc
  update_interval: 10s
  protocol_timeout: 15s
  fallback_nominal_voltage: 120V

sensor:
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: battery_level
    name: Battery Charge
    accuracy_decimals: 0
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: battery_voltage
    name: Battery Voltage
    accuracy_decimals: 2
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: runtime
    name: Runtime Remaining
    accuracy_decimals: 1
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: input_voltage
    name: Input Voltage
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: load_percent
    name: Load
    accuracy_decimals: 0
    state_class: measurement

text_sensor:
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: status
    name: UPS Status
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: manufacturer
    name: Manufacturer
    entity_category: diagnostic
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: model
    name: Model
    entity_category: diagnostic
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: firmware_version
    name: Firmware Version
    entity_category: diagnostic
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: serial_number
    name: Serial Number
    entity_category: diagnostic

binary_sensor:
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: on_battery
    name: On Battery
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: charging
    name: Battery Charging
  - platform: status
    name: ESPHome Connection
    entity_category: diagnostic

button:
  - platform: template
    name: Dump UPS USB Descriptor
    entity_category: diagnostic
    on_press:
      - lambda: id(ups_monitor).dump_usb_descriptors();
